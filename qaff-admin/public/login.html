<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Qaff Admin — تسجيل الدخول</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap');

    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #090a0f 0%, #16192b 100%);
      font-family: 'Cairo', system-ui, sans-serif;
      color: #e2e8f0;
    }

    .card {
      background: rgba(30, 33, 48, 0.6);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 16px;
      padding: 48px 40px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 8px 40px rgba(0, 0, 0, 0.5);
    }

    .logo {
      text-align: center;
      margin-bottom: 32px;
    }

    .logo h1 {
      font-size: 28px;
      font-weight: 800;
      color: #7c3aed;
      letter-spacing: -0.5px;
    }

    .logo p {
      font-size: 13px;
      color: #64748b;
      margin-top: 6px;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #94a3b8;
      margin-bottom: 8px;
    }

    input[type="password"] {
      width: 100%;
      height: 48px;
      background: #0f1117;
      border: 1px solid #2d3148;
      border-radius: 10px;
      padding: 0 16px;
      color: #e2e8f0;
      font-size: 16px;
      letter-spacing: 2px;
      outline: none;
      transition: border-color .2s;
    }

    input:focus {
      border-color: #7c3aed;
    }

    button {
      width: 100%;
      height: 48px;
      margin-top: 20px;
      background: linear-gradient(135deg, #7c3aed, #6d28d9);
      border: none;
      border-radius: 10px;
      color: #fff;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: opacity .2s;
    }

    button:hover {
      opacity: .9;
    }

    button:disabled {
      opacity: .5;
      cursor: not-allowed;
    }

    .error {
      color: #f87171;
      font-size: 13px;
      margin-top: 12px;
      text-align: center;
      display: none;
    }

    .hidden {
      display: none !important;
    }

    .link {
      display: block;
      text-align: center;
      margin-top: 16px;
      font-size: 13px;
      color: #94a3b8;
      text-decoration: none;
      cursor: pointer;
      transition: color 0.2s;
    }

    .link:hover {
      color: #e2e8f0;
    }
  </style>
</head>

<body>
  <div class="card" id="login-card">
    <div class="logo">
      <h1>🎛️ Qaff Admin</h1>
      <p>Master Control Panel</p>
    </div>
    <label>كلمة المرور</label>
    <input type="password" id="pass" placeholder="••••••••" autofocus>
    <button id="btn" onclick="login()">دخول</button>
    <a class="link" onclick="toggleReset(true)">نسيت كلمة المرور؟</a>
    <p class="error" id="err">كلمة المرور غير صحيحة</p>
  </div>

  <div class="card hidden" id="reset-card">
    <div class="logo">
      <h1>🔐 استعادة الحساب</h1>
      <p>برجاء إدخال بيانات الأمان المعطاة لك</p>
    </div>
    <label>رمز الأمان الخاص بك</label>
    <input type="password" id="r-code" placeholder="••••••••">
    <label style="margin-top: 16px">كلمة المرور الجديدة</label>
    <input type="password" id="r-pass" placeholder="6 أحرف كحد أدنى">

    <button id="r-btn" onclick="resetPassword()">تغيير وتسجيل الدخول</button>
    <a class="link" onclick="toggleReset(false)">العودة لتسجيل الدخول</a>
    <p class="error" id="r-err">بيانات غير صحيحة</p>
  </div>
  <script>
    document.getElementById('pass').addEventListener('keydown', e => { if (e.key === 'Enter') login() })
    async function login() {
      const pass = document.getElementById('pass').value
      const btn = document.getElementById('btn')
      const err = document.getElementById('err')
      if (!pass) return
      btn.disabled = true; btn.textContent = 'جاري التحقق...'
      err.style.display = 'none'
      try {
        const res = await fetch('/api/login', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password: pass })
        })
        const data = await res.json()
        if (data.token) {
          localStorage.setItem('qaff_admin_token', data.token)
          location.href = '/'
        } else {
          err.textContent = data.error || 'كلمة المرور غير صحيحة'
          err.style.display = 'block'
        }
      } catch { err.textContent = 'خطأ في الاتصال'; err.style.display = 'block' }
      btn.disabled = false; btn.textContent = 'دخول'
    }

    function toggleReset(show) {
      document.getElementById('login-card').classList.toggle('hidden', show);
      document.getElementById('reset-card').classList.toggle('hidden', !show);
      document.getElementById('r-err').style.display = 'none';
      document.getElementById('err').style.display = 'none';
      if (show) document.getElementById('r-code').focus();
      else document.getElementById('pass').focus();
    }

    async function resetPassword() {
      const code = document.getElementById('r-code').value;
      const pass = document.getElementById('r-pass').value;
      const btn = document.getElementById('r-btn');
      const err = document.getElementById('r-err');

      if (!code || !pass) return;
      btn.disabled = true; btn.textContent = 'جاري التحقق...';
      err.style.display = 'none';

      try {
        const res = await fetch('/api/admin/reset-password', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ security_code: code, new_password: pass })
        });
        const data = await res.json();

        if (data.success) {
          err.style.display = 'block';
          err.style.color = '#10b981';
          err.textContent = '✅ تم التغيير بنجاح!';
          setTimeout(() => {
            toggleReset(false);
            document.getElementById('pass').value = pass;
            login(); // auto login
          }, 1500)
        } else {
          err.style.color = '#f87171';
          err.textContent = data.error || 'حدث خطأ';
          err.style.display = 'block';
        }
      } catch {
        err.style.color = '#f87171';
        err.textContent = 'خطأ في الاتصال';
        err.style.display = 'block';
      }
      btn.disabled = false; btn.textContent = 'تغيير وتسجيل الدخول';
    }
  </script>
</body>

</html>
