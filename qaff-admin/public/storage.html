<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Qaff Admin — مساحات التخزين</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap');
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            min-height: 100vh;
            background: #080a12;
            background-image:
                radial-gradient(ellipse at 20% 20%, rgba(124,58,237,0.08) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 80%, rgba(14,165,233,0.06) 0%, transparent 50%);
            font-family: 'Cairo', system-ui, sans-serif;
            color: #e2e8f0;
        }

        nav {
            background: rgba(15,17,28,0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(255,255,255,0.06);
            padding: 0 32px;
            height: 68px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        nav h1 { font-size: 20px; font-weight: 900; color: #a855f7; letter-spacing: -0.5px; }
        nav .links a {
            color: #64748b; text-decoration: none;
            margin-right: 24px; font-size: 14px; font-weight: 700;
            transition: color 0.2s; padding-bottom: 2px;
        }
        nav .links a:hover { color: #e2e8f0; }
        nav .links a.active { color: #a855f7; border-bottom: 2px solid #a855f7; }
        nav .nav-right { display: flex; gap: 10px; align-items: center; }
        .btn-nav {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 10px;
            padding: 8px 18px;
            cursor: pointer; font-size: 13px; font-weight: 700;
            color: #94a3b8; font-family: 'Cairo', sans-serif;
            transition: all 0.2s;
        }
        .btn-nav:hover { background: rgba(255,255,255,0.09); color: #e2e8f0; }
        .btn-logout:hover { color: #f87171; border-color: rgba(248,113,113,0.3); }

        main { max-width: 1100px; margin: 0 auto; padding: 40px 24px; }

        .page-header {
            display: flex; align-items: center; justify-content: space-between;
            margin-bottom: 36px; flex-wrap: wrap; gap: 12px;
        }
        .page-title {
            font-size: 28px; font-weight: 900; color: #f8fafc;
            display: flex; align-items: center; gap: 12px;
        }
        .page-title span { font-size: 32px; }
        .refresh-info {
            font-size: 12px; color: #475569;
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 8px; padding: 6px 14px;
            display: flex; align-items: center; gap: 6px;
        }
        .refresh-dot {
            width: 7px; height: 7px; border-radius: 50%;
            background: #22c55e;
            animation: pulse-dot 2s infinite;
        }
        @keyframes pulse-dot {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(0.8); }
        }

        .cards { display: flex; flex-direction: column; gap: 24px; }

        .pool-card {
            background: rgba(22,25,40,0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 20px;
            padding: 28px 32px;
            box-shadow: 0 8px 32px -8px rgba(0,0,0,0.6);
            transition: transform 0.25s, box-shadow 0.25s, border-color 0.25s;
            position: relative; overflow: hidden;
        }
        .pool-card::before {
            content: '';
            position: absolute; top: 0; right: 0;
            width: 200px; height: 200px;
            border-radius: 50%;
            opacity: 0.04;
            pointer-events: none;
        }
        .pool-card.primary::before { background: radial-gradient(#7c3aed, transparent); }
        .pool-card.secondary::before { background: radial-gradient(#0ea5e9, transparent); }
        .pool-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 16px 48px -12px rgba(0,0,0,0.7);
            border-color: rgba(255,255,255,0.1);
        }

        .card-top {
            display: flex; align-items: flex-start;
            justify-content: space-between; gap: 20px;
            flex-wrap: wrap; margin-bottom: 24px;
        }
        .disk-info { display: flex; align-items: center; gap: 16px; }
        .disk-icon {
            width: 60px; height: 60px; border-radius: 16px;
            display: flex; align-items: center; justify-content: center;
            font-size: 28px; flex-shrink: 0;
        }
        .pool-card.primary .disk-icon { background: rgba(124,58,237,0.12); border: 1px solid rgba(124,58,237,0.2); }
        .pool-card.secondary .disk-icon { background: rgba(14,165,233,0.12); border: 1px solid rgba(14,165,233,0.2); }
        .disk-name { font-size: 20px; font-weight: 900; color: #f1f5f9; margin-bottom: 4px; }
        .disk-path {
            font-size: 12px; color: #64748b; font-family: monospace;
            background: rgba(0,0,0,0.35); padding: 3px 8px; border-radius: 6px;
            display: inline-block;
        }

        .badge-clients {
            display: inline-flex; align-items: center; gap: 6px;
            background: rgba(56,189,248,0.1); color: #38bdf8;
            border: 1px solid rgba(56,189,248,0.2);
            padding: 6px 16px; border-radius: 20px;
            font-size: 14px; font-weight: 800; white-space: nowrap;
        }

        .stats-row {
            display: flex; gap: 0; margin-bottom: 20px;
        }
        .stat-item {
            flex: 1; text-align: center;
            padding: 16px 8px;
            border-left: 1px solid rgba(255,255,255,0.05);
        }
        .stat-item:last-child { border-left: none; }
        .stat-label {
            font-size: 11px; color: #475569; font-weight: 700;
            text-transform: uppercase; letter-spacing: 0.5px;
            margin-bottom: 8px;
        }
        .stat-val {
            font-size: 30px; font-weight: 900; line-height: 1;
        }
        .stat-unit { font-size: 13px; color: #475569; font-weight: 600; margin-right: 3px; }
        .stat-pct { font-size: 13px; color: #64748b; margin-top: 4px; }

        .c-blue  { color: #38bdf8; }
        .c-green { color: #4ade80; }
        .c-yellow{ color: #fbbf24; }
        .c-red   { color: #f87171; }
        .c-white { color: #f1f5f9; }

        .bar-wrap {
            height: 10px; background: rgba(255,255,255,0.05);
            border-radius: 10px; overflow: hidden;
        }
        .bar-fill {
            height: 100%; border-radius: 10px;
            transition: width 0.6s ease;
            position: relative;
        }
        .bar-fill::after {
            content: '';
            position: absolute; inset: 0;
            background: linear-gradient(90deg, transparent 0%, rgba(255,255,255,0.15) 50%, transparent 100%);
            animation: shimmer 2s infinite;
        }
        @keyframes shimmer {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }

        .empty-state {
            text-align: center; padding: 80px 20px;
            color: #475569; font-size: 16px;
        }
        .empty-state .icon { font-size: 48px; margin-bottom: 16px; }

        .skeleton {
            background: linear-gradient(90deg, rgba(255,255,255,0.04) 25%, rgba(255,255,255,0.07) 50%, rgba(255,255,255,0.04) 75%);
            background-size: 200% 100%;
            animation: skeleton-shine 1.5s infinite;
            border-radius: 8px;
        }
        @keyframes skeleton-shine {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        .toast {
            position: fixed; bottom: 24px; right: 24px;
            background: #1e293b; color: #f1f5f9;
            padding: 14px 20px; border-radius: 12px;
            font-size: 14px; font-weight: 700;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            display: none; z-index: 9999;
            border: 1px solid rgba(255,255,255,0.08);
        }
        .toast.error { border-color: rgba(248,113,113,0.3); background: #1f1419; }
    </style>
</head>
<body>
    <nav>
        <h1>نظام Qaff</h1>
        <div class="links">
            <a href="/clients">العملاء</a>
            <a href="/dashboard">الإحصائيات</a>
            <a href="/storage" class="active">مساحات التخزين</a>
        </div>
        <div class="nav-right">
            <button class="btn-nav btn-logout" onclick="logout()">تسجيل الخروج</button>
        </div>
    </nav>

    <main>
        <div class="page-header">
            <div class="page-title">
                <span>💾</span>
                مساحات التخزين
            </div>
            <div class="refresh-info">
                <div class="refresh-dot"></div>
                يتجدد كل 15 ثانية
            </div>
        </div>

        <div class="cards" id="pools-container">
            <!-- skeleton -->
            <div class="pool-card primary">
                <div style="height:60px" class="skeleton"></div>
                <div style="height:10px;margin-top:24px" class="skeleton"></div>
            </div>
        </div>
    </main>

    <div id="toast" class="toast"></div>

    <script>
        const T = () => localStorage.getItem('qaff_admin_token');
        const H = () => ({ 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + T() });

        if (!T()) location.href = '/login';

        const fmt = (bytes) => {
            if (!bytes || isNaN(bytes)) return '0.0';
            return (bytes / 1024 / 1024 / 1024).toFixed(1);
        };

        async function loadPools() {
            try {
                const res = await fetch('/api/system/storage-pools', { headers: H() });
                if (res.status === 401) { location.href = '/login'; return; }
                const data = await res.json();
                const container = document.getElementById('pools-container');

                if (!data.pools || data.pools.length === 0) {
                    container.innerHTML = `<div class="empty-state"><div class="icon">💿</div>لا يوجد مساحات تخزين متاحة حالياً.</div>`;
                    return;
                }

                container.innerHTML = data.pools.map(p => {
                    const usedGB  = fmt(p.used);
                    const freeGB  = fmt(p.free);
                    const totalGB = fmt(p.total);
                    const pct     = p.usagePercent || 0;
                    const cls     = p.isPrimary ? 'primary' : 'secondary';

                    let barColor = '#4ade80';
                    let valClass = 'c-green';
                    if (pct > 70) { barColor = '#fbbf24'; valClass = 'c-yellow'; }
                    if (pct > 90) { barColor = '#f87171'; valClass = 'c-red'; }

                    const icon = p.isPrimary ? '🖥️' : '💽';

                    return `
                    <div class="pool-card ${cls}">
                        <div class="card-top">
                            <div class="disk-info">
                                <div class="disk-icon">${icon}</div>
                                <div>
                                    <div class="disk-name">${p.name}</div>
                                    <div class="disk-path">${p.path}</div>
                                </div>
                            </div>
                            <div class="badge-clients">👥 ${p.clientCount} عميل</div>
                        </div>

                        <div class="stats-row">
                            <div class="stat-item">
                                <div class="stat-label">المستخدم</div>
                                <div class="stat-val ${valClass}">${usedGB} <span class="stat-unit">GB</span></div>
                                <div class="stat-pct">${pct}%</div>
                            </div>
                            <div class="stat-item">
                                <div class="stat-label">المتاح</div>
                                <div class="stat-val c-blue">${freeGB} <span class="stat-unit">GB</span></div>
                            </div>
                            <div class="stat-item">
                                <div class="stat-label">الإجمالي</div>
                                <div class="stat-val c-white">${totalGB} <span class="stat-unit">GB</span></div>
                            </div>
                        </div>

                        <div class="bar-wrap">
                            <div class="bar-fill" style="width:${pct}%; background: linear-gradient(90deg, ${barColor}aa, ${barColor})"></div>
                        </div>
                    </div>`;
                }).join('');
            } catch (e) {
                console.error('Error loading pools:', e);
                showToast('خطأ في تحميل البيانات', true);
            }
        }

        function logout() {
            localStorage.removeItem('qaff_admin_token');
            location.href = '/login';
        }

        function showToast(msg, err = false) {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.className = 'toast' + (err ? ' error' : '');
            t.style.display = 'block';
            setTimeout(() => { t.style.display = 'none'; }, 3500);
        }

        loadPools();
        setInterval(loadPools, 15000);
    </script>
</body>
</html>
